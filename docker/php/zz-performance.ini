; Rendimiento en desarrollo.
; OPcache no valida timestamps en cada request: en este proyecto el bind mount de
; Windows hace que esa validacion cueste ~1-2 s por peticion.
; Tras cambiar PHP, Blade, rutas o configuracion hay que recargar PHP-FPM:
;   docker compose exec app sh -c 'kill -USR2 1'
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.file_update_protection=0
realpath_cache_size=4096k
realpath_cache_ttl=600
