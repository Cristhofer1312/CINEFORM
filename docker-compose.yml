# docker-compose.yml simplificado
#   Docker Compose ahora usa automáticamente la última especificación del formato Compose, por lo que no hace falta declarar explícitamente la version en el YAML. El atributo version sigue funcionando, pero genera esa 
#   advertencia para que elimines esa línea y evites confusión.
# version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Ejecuta las tareas programadas de app/Console/Kernel.php (p. ej. taller:limpiar-wizards).
  # Misma imagen y código que `app`; schedule:work revisa la agenda cada minuto.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    # Mismo usuario que los workers de php-fpm: si no, storage/logs quedaría de root.
    user: www-data
    volumes:
      - ./app:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  webserver:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  db:
    # Versión fijada. Subir de versión mayor exige pg_dumpall + restaurar en un volumen nuevo.
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: cineform
    ports:
      - "5432:5432"
    volumes:
      # Desde la imagen 18 el volumen se monta en /var/lib/postgresql (los datos van en 18/docker).
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d cineform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cineform.gob.ve
      PGADMIN_DEFAULT_PASSWORD: CAMBIA_ESTA_CLAVE_ADMIN
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - app-network

volumes:
  # pgdata: datos de PostgreSQL 17, conservados como respaldo hasta confirmar la migración a 18.
  pgdata:
  pgdata18:

networks:
  app-network:
    driver: bridge
