# docker-compose.yml simplificado
#   Docker Compose ahora usa automáticamente la última especificación del formato Compose, por lo que no hace falta declarar explícitamente la version en el YAML. El atributo version sigue funcionando, pero genera esa 
#   advertencia para que elimines esa línea y evites confusión.
# version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db
    networks:
      - app-network

  webserver:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: CAMBIA_ESTA_CLAVE_BD
      POSTGRES_DB: cineform
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cineform.gob.ve
      PGADMIN_DEFAULT_PASSWORD: CAMBIA_ESTA_CLAVE_ADMIN
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
