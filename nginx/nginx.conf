# HSTS solo cuando el visitante llegó por HTTPS (el proxy del servidor envía
# X-Forwarded-Proto, docs/instalacion-ssh.md paso 10). Por HTTP el navegador
# la ignora de todos modos, y con valor vacío nginx no envía la cabecera, así
# que la instalación solo por IP y HTTP sigue funcionando igual.
# Sin includeSubDomains: obligaría a HTTPS a todos los subdominios del dominio.
map $http_x_forwarded_proto $cabecera_hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # Plantillas de certificado (4 MB) + PDF: el límite por defecto (1 MB) las rechaza.
    client_max_body_size 20M;

    # No anunciar versiones (nginx/1.x, PHP/8.x): solo ayudan a buscar exploits.
    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    # Cabeceras de seguridad. "always" las incluye también en respuestas de error.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera=(self): el lector de QR de asistencia (public/js/menu.js) usa la cámara.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $cabecera_hsts always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Resolver "app" en cada petición con el DNS de Docker: con fastcgi_pass app:9000
        # nginx guarda la IP del arranque y da 502 cuando app se recrea con otra IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    location ~ /\.
    {
        deny all;
    }

    location ~* \.(jpg|jpeg|gif|css|png|js|ico|html|svg|ttf|woff|woff2)$ {
        expires max;
        log_not_found off;
    }
}