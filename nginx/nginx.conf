server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # Plantillas de certificado (4 MB) + PDF: el límite por defecto (1 MB) las rechaza.
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Resolver "app" en cada petición con el DNS de Docker: con fastcgi_pass app:9000
        # nginx guarda la IP del arranque y da 502 cuando app se recrea con otra IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    location ~ /\.
    {
        deny all;
    }

    location ~* \.(jpg|jpeg|gif|css|png|js|ico|html|svg|ttf|woff|woff2)$ {
        expires max;
        log_not_found off;
    }
}